      <stop offset="100%" stop-color="#0F0F14" />
    </linearGradient>
    <linearGradient id="ghostGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
